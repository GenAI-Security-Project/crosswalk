name: Weekly Source Watch

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      watcher:
        description: 'Run a specific watcher (owasp|arxiv|nvd|frameworks) or leave blank for all'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no issues opened)'
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  watch:
    name: Monitor external sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore watch state
        uses: actions/cache@v4
        with:
          path: data/.watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: |
            watch-state-

      - name: Run source watchers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ -n "${{ inputs.watcher }}" ]; then FLAGS="$FLAGS --watcher ${{ inputs.watcher }}"; fi
          node scripts/watch.js $FLAGS

  monthly-regenerate:
    name: Monthly report regeneration
    # Runs on the weekly schedule, but the regeneration itself is gated to the
    # first Monday of the month by the "Should run" step below — GitHub cron
    # cannot express "first Monday". Manual dispatch always runs it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Should run this week
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%-d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the first Monday of the month — skipping regeneration."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Use Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate data layer and reports
        if: steps.gate.outputs.run == 'true'
        run: |
          node scripts/generate.js
          node scripts/compliance-report.js
          node scripts/incidents-report.js

      # The generators stamp a "// Generated: <date>" header, so a plain diff
      # is non-empty on every run regardless of content. Ignoring that line is
      # what makes this fire only when the data actually changed — without it,
      # every run produces a no-op branch.
      - name: Check for changes
        id: diff
        if: steps.gate.outputs.run == 'true'
        run: |
          git diff --quiet -I'^// Generated: ' || echo "changed=true" >> "$GITHUB_OUTPUT"

      # GitHub Actions is not permitted to create pull requests in this
      # repository, and issues are disabled, so neither can be depended on.
      # The branch is pushed and the compare link is written to the run
      # summary, which always works and needs no repository settings. Opening
      # an issue is attempted as a convenience and never fails the build.
      - name: Push regenerated branch and report where to review it
        if: steps.gate.outputs.run == 'true' && steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="auto/monthly-regenerate-$(date +%Y%m%d)"
          BASE="${{ github.event.repository.default_branch }}"
          COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/${BASE}...${BRANCH}?expand=1"

          # Capture the summary before committing: the checkout is shallow, so
          # HEAD~1 and origin/<base> are not necessarily available afterwards.
          STAT=$(git --no-pager diff --stat)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: monthly regeneration of data layer and compliance reports"
          git push --force-with-lease origin "$BRANCH"

          {
            echo "## Monthly report regeneration"
            echo
            echo "The data layer changed. Regenerated output is on \`${BRANCH}\`."
            echo
            echo "**[Open the pull request](${COMPARE})**"
            echo
            echo "This workflow cannot open the PR itself: GitHub Actions is not"
            echo "permitted to create pull requests in this repository."
            echo
            echo '```'
            echo "${STAT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          gh issue create \
            --title "chore: monthly report regeneration ($(date +%Y-%m-%d))" \
            --body "Regenerated output is on \`${BRANCH}\`. Open the PR: ${COMPARE}" \
            --label automated-watch \
            || echo "Issue not created (issues are disabled on this repository) — see the run summary above."
